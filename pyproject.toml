[project]
name = "cdv-oed-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # core scientific
    "numpy",
    "torch",
    "pandas",
    "xarray",
    "scipy",
    "shapely",
    # plotting
    "matplotlib",
    # progress
    "tqdm",
    # normalizing flows
    "zuko",
    # genetic optimization
    "pygad",
    # OED framework
    "geobed",
    # travel-time lookup (used in notebooks/forward modelling)
    "pykonal",
    # NetCDF/HDF5 backends required by xarray for .nc file I/O
    "netcdf4",
    "h5netcdf",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[tool.uv.sources]
geobed = { git = "https://github.com/dominik-strutz/GeoBED" }
